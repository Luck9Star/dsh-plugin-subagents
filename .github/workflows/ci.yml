name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
        # The suite never needs product CLIs or API keys (pure logic + fakes,
        # T09/T10 §10); the Windows matrix is what exercises the .cmd-shim
        # launching paths. `npm run lint` also enforces the red-line-12
        # dsh-subagent import whitelist on every platform.
